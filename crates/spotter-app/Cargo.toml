[package]
name = "spotter-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "spotter-app"
path = "src/main.rs"

[dependencies]
spotter-core.workspace = true
anyhow.workspace = true
rune.workspace = true
rune-kit.workspace = true
serde_json.workspace = true
